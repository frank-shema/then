spring.datasource.url=jdbc:postgresql://localhost:5432/manage
spring.datasource.username=postgres
spring.datasource.password=Shema0987!!!
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE (Optional but recommended for development)
# ===============================
# Allows Hibernate to update the schema (be careful in production!)
# Common values:
#   validate:  Validate the schema, make no changes to the database.
#   update:    Update the schema.
#   create:    Creates the schema, destroying previous data.
#   create-drop: Create and then drop the schema at the end of the session.
#   none:      Do nothing with the schema.
spring.jpa.hibernate.ddl-auto=update

# Show SQL statements in the console (good for debugging)
spring.jpa.show-sql=true

# Format SQL statements in the console
spring.jpa.properties.hibernate.format_sql=true

# Specify the PostgreSQL dialect for Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

